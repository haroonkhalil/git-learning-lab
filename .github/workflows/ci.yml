name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test
        run: |
          echo "Running tests..."
          test -f index.html
          test -f about.html
          test -f contact.html
          echo "All tests passed!"